<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raviranjan.OS — Deployment Diagnostics</title>
<style>
  :root{
    --bg:#09090B;--surf:#0F0F12;--elev:#18181B;--line:#27272A;--ink:#FAFAFA;--mut:#A1A1AA;--faint:#8A8A93;
    --brand:#3B82F6;--ok:#10B981;--warn:#F59E0B;--bad:#F43F5E;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  html.light{--bg:#fff;--surf:#fff;--elev:#F4F4F5;--line:#E4E4E7;--ink:#18181B;--mut:#52525B;--faint:#71717A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 64px}
  h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12.5px;margin:0 0 20px}
  .verdict{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--elev);margin-bottom:20px}
  .verdict b{display:block;font-size:13.5px}
  .verdict span{font-size:12.5px;color:var(--mut)}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .card{border:1px solid var(--line);background:var(--surf);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:11px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--elev)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td{padding:8px 14px;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.k{font-family:var(--mono);color:var(--mut);white-space:nowrap;width:230px}
  td.v{font-family:var(--mono);color:var(--ink);word-break:break-word}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-family:var(--mono);border:1px solid var(--line);color:var(--mut)}
  .ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  .bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
  .btn{appearance:none;border:1px solid var(--line);background:var(--elev);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:color-mix(in srgb,var(--brand) 50%,transparent)}
  code{font-family:var(--mono);font-size:11.5px;background:var(--elev);padding:1px 5px;border-radius:4px}
  pre{margin:0;padding:12px 14px;background:var(--elev);border-radius:8px;font-family:var(--mono);font-size:11.5px;overflow:auto;max-height:220px;color:var(--mut)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Deployment diagnostics</h1>
  <p class="sub">Checks the deployed bundle and the <code>/api</code> hop. Nothing is sent anywhere; every call is a plain GET.</p>

  <div class="verdict" id="verdict">
    <span class="dot" style="background:var(--faint)"></span>
    <div><b>Running checks…</b><span>This takes a few seconds.</span></div>
  </div>

  <div class="row">
    <button class="btn" onclick="runAll()">Re-run checks</button>
    <button class="btn" onclick="document.documentElement.classList.toggle('light')">Toggle theme</button>
  </div>

  <div class="card">
    <h2>1 · Deployed files</h2>
    <table id="assets"><tr><td class="k">waiting…</td><td class="v"></td></tr></table>
  </div>

  <div class="card">
    <h2>2 · API hop (/api)</h2>
    <table id="apis"><tr><td class="k">waiting…</td><td class="v"></td></tr></table>
  </div>

  <div class="card">
    <h2>3 · Runtime</h2>
    <table id="env"></table>
  </div>

  <div class="card">
    <h2>4 · Raw sample (/api/profile)</h2>
    <pre id="raw">—</pre>
  </div>
</div>

<script>
(function () {
  try {
    var stored = localStorage.getItem('theme') || 'system';
    var theme = (stored === 'light' || stored === 'dark') ? stored
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.classList.remove('light', 'dark');
    document.documentElement.classList.add(theme);
  } catch (e) {}
})();

var ASSETS = [
  ['/tailwind.css', 'css'],
  ['/design-system.css', 'css'],
  ['/styles.css', 'css'],
  ['/theme.js', 'js'],
  ['/main_app.js', 'js'],
  ['/vendor/lucide.min.js', 'js'],
  ['/admin_cms.html', 'html']
];

var APIS = [
  '/api',
  '/api/profile',
  '/api/projects?size=5',
  '/api/activity?size=3',
  '/api/activity/telemetry'
];

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function pill(kind, text) {
  var p = el('span', 'pill ' + kind, text);
  return p;
}

function row(table, key, valueNode) {
  var tr = document.createElement('tr');
  tr.appendChild(el('td', 'k', key));
  var v = el('td', 'v');
  v.appendChild(valueNode);
  tr.appendChild(v);
  table.appendChild(tr);
}

function isHtml(type, text) {
  return (type || '').indexOf('text/html') === 0 || /^\s*<(!doctype|html)/i.test(text || '');
}

async function probe(url, expect) {
  var started = performance.now();
  try {
    var res = await fetch(url, { cache: 'no-store' });
    var text = await res.text();
    var type = res.headers.get('content-type') || '';
    return {
      ok: res.ok,
      status: res.status,
      type: type,
      ms: Math.round(performance.now() - started),
      text: text,
      html: isHtml(type, text),
      expect: expect
    };
  } catch (err) {
    return { ok: false, status: 0, type: '', ms: Math.round(performance.now() - started), text: '', error: String(err), expect: expect };
  }
}

async function runAssets() {
  var table = document.getElementById('assets');
  table.innerHTML = '';
  var missing = [];
  for (var i = 0; i < ASSETS.length; i++) {
    var url = ASSETS[i][0];
    var kind = ASSETS[i][1];
    var r = await probe(url, kind);
    var frag = document.createDocumentFragment();
    var looksRight =
      (kind === 'css' && !r.html && r.ok) ||
      (kind === 'js' && !r.html && r.ok) ||
      (kind === 'html' && r.html && r.ok);

    if (!looksRight) missing.push(url);

    frag.appendChild(pill(looksRight ? 'ok' : 'bad', r.ok ? r.status + ' ' + (r.html ? 'html' : 'file') : 'missing'));
    frag.appendChild(document.createTextNode(' ' + r.ms + 'ms · ' + (r.type || 'no type')));
    if (r.html && kind !== 'html') {
      frag.appendChild(document.createTextNode(' '));
      frag.appendChild(pill('warn', 'served index.html instead'));
    }
    row(table, url, frag);
  }
  return missing;
}

async function runApis() {
  var table = document.getElementById('apis');
  table.innerHTML = '';
  var summary = { html: 0, failed: 0, ok: 0 };

  for (var i = 0; i < APIS.length; i++) {
    var url = APIS[i];
    var r = await probe(url, 'json');
    var frag = document.createDocumentFragment();

    if (r.html) {
      summary.html++;
      frag.appendChild(pill('bad', r.status + ' HTML'));
      frag.appendChild(document.createTextNode(' the host answered with a page, not JSON'));
    } else if (!r.ok) {
      summary.failed++;
      frag.appendChild(pill('bad', r.status || 'network error'));
      frag.appendChild(document.createTextNode(' ' + (r.error || 'no response')));
    } else {
      var detail = '';
      try {
        var json = JSON.parse(r.text);
        summary.ok++;
        if (json.status) detail = 'status=' + json.status + (json.database_mode ? ' · ' + json.database_mode : '');
        else if (json.success !== undefined) {
          var d = json.data;
          if (Array.isArray(d)) detail = 'data[] · ' + d.length + ' items';
          else if (d && Array.isArray(d.content)) detail = 'data.content[] · ' + d.content.length + ' of ' + (d.totalElements || d.content.length);
          else if (d && typeof d === 'object') detail = 'data{' + Object.keys(d).slice(0, 6).join(', ') + '}';
          else detail = 'data=' + String(d);
        }
        frag.appendChild(pill('ok', r.status + ' JSON'));
        frag.appendChild(document.createTextNode(' ' + r.ms + 'ms · ' + detail));
      } catch (e) {
        frag.appendChild(pill('warn', r.status + ' unparsed'));
        frag.appendChild(document.createTextNode(' ' + r.text.slice(0, 80)));
      }
    }
    row(table, url, frag);
  }
  return summary;
}

function runEnv() {
  var table = document.getElementById('env');
  table.innerHTML = '';
  var rows = [
    ['page', location.href],
    ['theme', document.documentElement.className || '(none)'],
    ['DS_API_BASE', window.DS_API_BASE || '(not installed — theme.js is old or missing)'],
    ['DS_API_IS_DIRECT', typeof window.DS_API_IS_DIRECT === 'function' ? String(window.DS_API_IS_DIRECT()) : 'n/a'],
    ['lucide', window.lucide ? 'loaded' : 'missing'],
    ['DSTheme', window.DSTheme ? 'loaded' : 'missing'],
    ['tailwind.css link', (document.querySelector('link[href*="tailwind.css"]') ? 'present' : 'absent (still using the CDN build)')],
    ['lucide script', (document.querySelector('script[src*="vendor/lucide"]') ? 'vendored' : 'CDN')],
    ['user agent', navigator.userAgent]
  ];
  rows.forEach(function (r) {
    row(table, r[0], document.createTextNode(r[1]));
  });
}

async function runRaw() {
  var pre = document.getElementById('raw');
  var r = await probe('/api/profile', 'json');
  pre.textContent = r.text ? r.text.slice(0, 1200) : ('(no body) ' + (r.error || ''));
}

function setVerdict(missing, api) {
  var box = document.getElementById('verdict');
  var dot = box.querySelector('.dot');
  var b = box.querySelector('b');
  var s = box.querySelector('span');

  var v3 = missing.indexOf('/tailwind.css') === -1 && missing.indexOf('/vendor/lucide.min.js') === -1;

  if (api.html > 0) {
    dot.style.background = 'var(--bad)';
    b.textContent = 'API is not proxied on this host';
    s.textContent = 'The server answered /api with an HTML page. Set the Vercel Root Directory to "frontend" (so vercel.json is used), or deploy the v3 theme.js which falls back to the backend directly.';
  } else if (api.ok === 0) {
    dot.style.background = 'var(--bad)';
    b.textContent = 'API unreachable';
    s.textContent = 'No /api call returned JSON. Check that the Render backend is awake, then reload.';
  } else if (missing.length > 0) {
    dot.style.background = 'var(--warn)';
    b.textContent = 'API works, but the deployment is missing files';
    s.textContent = 'Missing: ' + missing.join(', ') + '. The deployed bundle is older than the current frontend/public folder — redeploy it.';
  } else if (!v3) {
    dot.style.background = 'var(--warn)';
    b.textContent = 'API works · older bundle';
    s.textContent = 'Deploy v3 (tailwind.css + vendored lucide) for the latest UI.';
  } else {
    dot.style.background = 'var(--ok)';
    b.textContent = 'All good';
    s.textContent = 'Assets are deployed and every API call returned JSON.';
  }
}

async function runAll() {
  var box = document.getElementById('verdict');
  box.querySelector('b').textContent = 'Running checks…';
  box.querySelector('.dot').style.background = 'var(--faint)';
  runEnv();
  var missing = await runAssets();
  var api = await runApis();
  await runRaw();
  setVerdict(missing, api);
}

runAll();
</script>
</body>
</html>
