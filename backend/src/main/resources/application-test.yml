spring:
  datasource:
    url: ${NEON_DB_URL:${NEON_DATABASE_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/raviranjan_os}}}}
    driver-class-name: org.postgresql.Driver
    username: ${NEON_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
